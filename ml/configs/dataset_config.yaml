# SnapMenu ML - Dataset Configuration
# Dataset: compilado-de-ingredientesalimentos (Kaggle)

dataset:
  name: "snapmenu-ingredients"
  version: "1.0"
  source: "kagglehub://guigasousa/compilado-de-ingredientesalimentos"
  base_path: "/kaggle/input/compilado-de-ingredientesalimentos/ProjetoIntegrador6/train"

  # Split ratios
  splits:
    train: 0.70
    val: 0.15
    test: 0.15
  
  # Seed for reproducibility
  random_seed: 42

  # Class mapping (english folder name → spanish display name)
  class_mapping:
    apple: "manzana"
    apricot: "damasco"
    avocado: "palta"
    bacon: "tocino"
    bagels: "bagel"
    baking_powder: "polvo de hornear"
    banana: "plátano"
    bay_leaves: "laurel"
    beans: "frijoles"
    beef: "carne de res"
    beetroot: "betarraga"
    black_beans: "frijoles negros"
    blackberries: "moras"
    black_pepper: "pimienta negra"
    bread: "pan"
    broccoli: "brócoli"
    brown_sugar: "azúcar morena"
    butter: "mantequilla"
    cabbage: "repollo"
    capsicum: "pimiento"
    carrots: "zanahoria"
    cauliflower: "coliflor"
    celery: "apio"
    cheese: "queso"
    cherries: "cerezas"
    chicken: "pollo"
    chili_powder: "ají en polvo"
    chilli: "ají"
    chocolate: "chocolate"
    cilantro_leaves: "cilantro"
    coconut: "coco"
    corn: "maíz"
    corn_starch: "maicena"
    crab: "cangrejo"
    cranberries: "arándanos"

  # Classes to exclude
  exclude_classes:
    - "Unlabeled"

  # Balance strategy
  balance:
    min_samples_per_class: 100       # Classes below this → augment offline
    max_samples_per_class: 2000      # Classes above this → subsample
    augment_target: 300              # Target for augmented small classes

preprocessing:
  image_size: 224                    # EfficientNetV2-B0 input size
  color_mode: "RGB"
  normalize:
    mean: [0.485, 0.456, 0.406]     # ImageNet mean
    std: [0.229, 0.224, 0.225]      # ImageNet std

augmentation:
  train:
    horizontal_flip: true
    vertical_flip: false
    rotation_degrees: 15
    color_jitter:
      brightness: 0.3
      contrast: 0.3
      saturation: 0.2
      hue: 0.1
    random_resized_crop:
      scale: [0.8, 1.0]
      ratio: [0.9, 1.1]
    random_erasing:
      probability: 0.1
  val:
    resize: 256
    center_crop: 224

output:
  processed_dir: "./data/processed"
  splits_dir: "./data/splits"
  models_dir: "./models"
  logs_dir: "./logs"
